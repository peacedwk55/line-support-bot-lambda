<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demo IAC</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f4f8; }
    .card { background: white; padding: 2rem 3rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #2d3748; }
    .badge { display: inline-block; background: #4299e1; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Demo IAC</h1>
    <p>Provisioned with Terraform · Configured with Ansible</p>
    <div>
      <span class="badge">Terraform</span>
      <span class="badge">Docker</span>
      <span class="badge">Ansible</span>
    </div>
  </div>
</body>
</html>
