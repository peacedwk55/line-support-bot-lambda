---
- name: Setup web container
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Wait for container to be running
      command: docker inspect -f "{{ '{{' }}.State.Running{{ '}}' }}" demo-iac-web
      register: container_state
      retries: 10
      delay: 3
      until: container_state.stdout == "true"
      changed_when: false

    - name: Show container status
      debug:
        msg: "Container demo-iac-web is running: {{ container_state.stdout }}"
