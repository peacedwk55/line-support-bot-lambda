---
- name: Deploy web application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Copy index.html into container
      command: docker cp /mnt/d/Project/Demo-IAC/docker/app/html/index.html demo-iac-web:/usr/share/nginx/html/index.html

    - name: Copy nginx config into container
      command: docker cp /mnt/d/Project/Demo-IAC/docker/app/nginx.conf demo-iac-web:/etc/nginx/conf.d/default.conf

    - name: Reload nginx
      command: docker exec demo-iac-web nginx -s reload

    - name: Health check
      uri:
        url: "http://localhost:8080/health"
        status_code: 200
      retries: 5
      delay: 2
