apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pipeline-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: pipeline-backend
          image: ghcr.io/peacedwk55/pipeline-backend:v7
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pipeline_monitor
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: postgres
            - name: REDIS_URL
              value: redis://redis:6379
            - name: JWT_SECRET
              value: pipeline-monitor-secret-2026
            - name: AZURE_ORG_URL
              value: https://cdscom.visualstudio.com
            - name: AZURE_PAT
              valueFrom:
                secretKeyRef:
                  name: azure-secret
                  key: pat
            - name: ALLOWED_PROJECTS
              value: CdsPaperlessWebService,MDHPortalSystem,MDHLTDocMgt,e-PinkForm,iXIMPLE_MANIFEST,MDHLTExpressTracking
            - name: NEXT_PUBLIC_API_URL
              value: http://backend:3001
            - name: HOSTNAME
              value: "0.0.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pipeline-monitor
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001