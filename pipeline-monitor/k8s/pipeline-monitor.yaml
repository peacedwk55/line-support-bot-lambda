apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pipeline-monitor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://cdscom.visualstudio.com/DefaultCollection/Demo-Pipeline/_git/Demo-Pipeline
    targetRevision: develop
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: pipeline-monitor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true